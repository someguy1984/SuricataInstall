# Observe-only: log a file being given the setuid bit (chmod u+s, mode 04000).
# A setuid-root copy of a shell is the classic way to keep root after an
# exploit: anyone who runs it becomes root, with no password and no log entry
# from sudo. privilege-escalation.yaml sees a process switch to uid 0; this
# sees the door being built.
#
# Package installs set the bit on the handful of programs that need it (sudo,
# su, mount, passwd, ...), so dpkg shows up here during upgrades. Anything else
# is worth a look.
#
# Limitation: this is the chmod/fchmod path. A file created with the bit
# already set, or unpacked with it by an archive tool running as root, does not
# pass through it.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "setuid-files"
spec:
  kprobes:
  - call: "security_path_chmod"
    syscall: false
    message: "Setuid bit set on a file"
    args:
    - index: 0
      type: "path"
    - index: 1 # umode_t mode (shown in decimal: 2541 is 04755)
      type: "uint16"
      label: "mode"
    selectors:
    - matchArgs:
      - index: 1
        operator: "Mask"
        values:
        - "2048" # S_ISUID (04000)
