# Observe-only: log changes to places where malware installs itself to survive
# a reboot or a new login (cron, systemd units, autostart entries, shell
# start-up files, preload, udev and module autoloading, apt sources).
#
# Four ways of putting something there are covered:
#   security_file_permission  writing into a file (MAY_WRITE, 0x02). Every write()
#                             call reaches the hook, hence the rate limit.
#   security_path_symlink     creating a symlink. This is what `systemctl enable`
#                             does, so enabling a unit shows up here.
#   security_path_link        creating a hard link.
#   security_path_rename      moving a file into place. Editors and installers
#                             write a temporary file and rename it over the real
#                             one, which the write hook alone does not see for
#                             single files such as ~/.bashrc.
# Directories are matched by prefix; single files by their directory plus name
# (the last three hooks only see a directory and a name, not a full path).
# The single files share one selector per hook, "one of these directories AND
# one of these names", so an odd combination such as /etc/config also matches.
# That is deliberate: Tetragon allows a policy only 8 exact-match lists (and 8
# prefix lists), and a selector per directory would need 24.
# Package upgrades (dpkg, unattended-upgrades) will show up here too.
#
# @HOME@ is replaced by the watched user's home directory when the policies are
# installed (WATCH_USER in config.sh).
#
# When adding a location, add it to every hook: the directory list appears four
# times (once per hook) and the single-file list three times.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "persistence"
spec:
  kprobes:
  - call: "security_file_permission"
    syscall: false
    return: true
    message: "Write to an autostart / persistence location"
    args:
    - index: 0
      type: "file"
    - index: 1
      type: "int" # 0x04 is MAY_READ, 0x02 is MAY_WRITE
    returnArg:
      index: 0
      type: "int"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        # scheduled jobs
        - "/etc/cron"
        - "/etc/anacrontab"
        - "/var/spool/cron/"
        # services and login autostart
        - "/etc/systemd/system/"
        - "/etc/systemd/user/"
        - "@HOME@/.config/systemd/user/"
        - "/etc/xdg/autostart/"
        - "@HOME@/.config/autostart/"
        - "/etc/rc.local"
        # shell startup files
        - "/etc/profile"
        - "/etc/bash.bashrc"
        - "/etc/environment"
        - "@HOME@/.bashrc"
        - "@HOME@/.bash_aliases"
        - "@HOME@/.profile"
        - "@HOME@/.bash_profile"
        - "@HOME@/.bash_logout"
        - "@HOME@/.zshrc"
        - "@HOME@/.zprofile"
        # library preloading, device and module hooks
        - "/etc/ld.so.preload"
        - "/etc/ld.so.conf"
        - "/etc/udev/rules.d/"
        - "/etc/modules-load.d/"
        - "/etc/modprobe.d/"
        # remote login keys, and ssh options that run commands
        - "@HOME@/.ssh/authorized_keys"
        - "@HOME@/.ssh/config"
        - "@HOME@/.ssh/rc"
        # package sources and signing keys
        - "/etc/apt/sources.list"
        - "/etc/apt/trusted.gpg"
        - "/etc/apt/keyrings/"
        # hooks that run as root automatically
        - "/etc/apt/apt.conf.d/"            # APT::Update::Pre-Invoke etc.
        - "/etc/update-motd.d/"             # runs on every login
        - "/etc/NetworkManager/dispatcher.d/"
        - "/etc/init.d/"
        - "/etc/systemd/system-generators/"
        - "/usr/lib/systemd/system/"        # also written by dpkg upgrades
        # authentication stack (PAM backdoors) and policy overrides
        - "/etc/pam.d/"
        - "/etc/security/"
        - "/etc/polkit-1/rules.d/"
        # root's shell startup files
        - "/root/.bashrc"
        - "/root/.profile"
        # per-user environment and desktop autostart
        - "@HOME@/.config/environment.d/"
        - "@HOME@/.local/share/applications/"
      - index: 1
        operator: "Mask"
        values:
        - "2" # MAY_WRITE
      matchActions:
      - action: Post
        rateLimit: "1m"

  - call: "security_path_symlink"
    syscall: false
    message: "Symlink created in an autostart / persistence location"
    args:
    - index: 0 # const struct path *dir: where the link is created
      type: "path"
    - index: 1 # struct dentry *dentry: the link itself
      type: "string"
      resolve: "d_name.name"
      label: "link"
    - index: 2 # const char *old_name: what it points to
      type: "string"
      label: "target"
    selectors:
    - matchArgs:
      - args: [0]
        operator: "Prefix"
        values:
        - "/etc/cron"
        - "/var/spool/cron"
        - "/etc/systemd/system"             # includes the *.wants directories
        - "/etc/systemd/user"
        - "@HOME@/.config/systemd/user"
        - "/etc/xdg/autostart"
        - "@HOME@/.config/autostart"
        - "/etc/profile.d"
        - "/etc/ld.so.conf.d"
        - "/etc/udev/rules.d"
        - "/etc/modules-load.d"
        - "/etc/modprobe.d"
        - "/etc/apt/sources.list.d"
        - "/etc/apt/trusted.gpg.d"
        - "/etc/apt/keyrings"
        - "/etc/apt/apt.conf.d"
        - "/etc/update-motd.d"
        - "/etc/NetworkManager/dispatcher.d"
        - "/etc/init.d"
        - "/etc/systemd/system-generators"
        - "/usr/lib/systemd/system"
        - "/etc/pam.d"
        - "/etc/security"
        - "/etc/polkit-1/rules.d"
        - "@HOME@/.config/environment.d"
        - "@HOME@/.local/share/applications"
    - matchArgs:
      - args: [0]
        operator: "Equal"
        values:
        - "@HOME@"
        - "@HOME@/.ssh"
        - "/etc"
        - "/root"
      - args: [1]
        operator: "Equal"
        values:
        # in @HOME@ (and /root)
        - ".bashrc"
        - ".bash_aliases"
        - ".profile"
        - ".bash_profile"
        - ".bash_logout"
        - ".zshrc"
        - ".zprofile"
        # in @HOME@/.ssh
        - "authorized_keys"
        - "config"
        - "rc"
        # in /etc
        - "ld.so.preload"
        - "ld.so.conf"
        - "rc.local"
        - "environment"
        - "anacrontab"
        - "crontab"
        - "profile"
        - "bash.bashrc"

  - call: "security_path_link"
    syscall: false
    message: "Hard link created in an autostart / persistence location"
    args:
    - index: 1 # const struct path *new_dir: where the link is created
      type: "path"
    - index: 2 # struct dentry *new_dentry: the link itself
      type: "string"
      resolve: "d_name.name"
      label: "link"
    selectors:
    - matchArgs:
      - args: [0]
        operator: "Prefix"
        values:
        - "/etc/cron"
        - "/var/spool/cron"
        - "/etc/systemd/system"
        - "/etc/systemd/user"
        - "@HOME@/.config/systemd/user"
        - "/etc/xdg/autostart"
        - "@HOME@/.config/autostart"
        - "/etc/profile.d"
        - "/etc/ld.so.conf.d"
        - "/etc/udev/rules.d"
        - "/etc/modules-load.d"
        - "/etc/modprobe.d"
        - "/etc/apt/sources.list.d"
        - "/etc/apt/trusted.gpg.d"
        - "/etc/apt/keyrings"
        - "/etc/apt/apt.conf.d"
        - "/etc/update-motd.d"
        - "/etc/NetworkManager/dispatcher.d"
        - "/etc/init.d"
        - "/etc/systemd/system-generators"
        - "/usr/lib/systemd/system"
        - "/etc/pam.d"
        - "/etc/security"
        - "/etc/polkit-1/rules.d"
        - "@HOME@/.config/environment.d"
        - "@HOME@/.local/share/applications"
    - matchArgs:
      - args: [0]
        operator: "Equal"
        values:
        - "@HOME@"
        - "@HOME@/.ssh"
        - "/etc"
        - "/root"
      - args: [1]
        operator: "Equal"
        values:
        # in @HOME@ (and /root)
        - ".bashrc"
        - ".bash_aliases"
        - ".profile"
        - ".bash_profile"
        - ".bash_logout"
        - ".zshrc"
        - ".zprofile"
        # in @HOME@/.ssh
        - "authorized_keys"
        - "config"
        - "rc"
        # in /etc
        - "ld.so.preload"
        - "ld.so.conf"
        - "rc.local"
        - "environment"
        - "anacrontab"
        - "crontab"
        - "profile"
        - "bash.bashrc"

  - call: "security_path_rename"
    syscall: false
    message: "File moved into an autostart / persistence location"
    args:
    - index: 0 # const struct path *old_dir
      type: "path"
      label: "from_dir"
    - index: 1 # struct dentry *old_dentry
      type: "string"
      resolve: "d_name.name"
      label: "from"
    - index: 2 # const struct path *new_dir
      type: "path"
      label: "to_dir"
    - index: 3 # struct dentry *new_dentry
      type: "string"
      resolve: "d_name.name"
      label: "to"
    selectors:
    - matchArgs:
      - args: [2]
        operator: "Prefix"
        values:
        - "/etc/cron"
        - "/var/spool/cron"
        - "/etc/systemd/system"
        - "/etc/systemd/user"
        - "@HOME@/.config/systemd/user"
        - "/etc/xdg/autostart"
        - "@HOME@/.config/autostart"
        - "/etc/profile.d"
        - "/etc/ld.so.conf.d"
        - "/etc/udev/rules.d"
        - "/etc/modules-load.d"
        - "/etc/modprobe.d"
        - "/etc/apt/sources.list.d"
        - "/etc/apt/trusted.gpg.d"
        - "/etc/apt/keyrings"
        - "/etc/apt/apt.conf.d"
        - "/etc/update-motd.d"
        - "/etc/NetworkManager/dispatcher.d"
        - "/etc/init.d"
        - "/etc/systemd/system-generators"
        - "/usr/lib/systemd/system"
        - "/etc/pam.d"
        - "/etc/security"
        - "/etc/polkit-1/rules.d"
        - "@HOME@/.config/environment.d"
        - "@HOME@/.local/share/applications"
    - matchArgs:
      - args: [2]
        operator: "Equal"
        values:
        - "@HOME@"
        - "@HOME@/.ssh"
        - "/etc"
        - "/root"
      - args: [3]
        operator: "Equal"
        values:
        # in @HOME@ (and /root)
        - ".bashrc"
        - ".bash_aliases"
        - ".profile"
        - ".bash_profile"
        - ".bash_logout"
        - ".zshrc"
        - ".zprofile"
        # in @HOME@/.ssh
        - "authorized_keys"
        - "config"
        - "rc"
        # in /etc
        - "ld.so.preload"
        - "ld.so.conf"
        - "rc.local"
        - "environment"
        - "anacrontab"
        - "crontab"
        - "profile"
        - "bash.bashrc"
