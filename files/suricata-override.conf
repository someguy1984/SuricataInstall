# Installed by install.sh as /etc/systemd/system/suricata.service.d/override.conf
# Runs Suricata inline on NFQUEUE 0 (IPS mode) instead of the packaged af-packet (IDS) mode.
[Unit]
Wants=suricata-nfqueue.service
After=suricata-nfqueue.service

[Service]
# Bring HOME_NET up to date for whatever network we booted on ("+": outside the sandbox below,
# so it can write suricata.yaml; "-": a failure here must not stop Suricata starting)
ExecStartPre=-+/usr/local/sbin/suricata-home-net --no-reload
ExecStart=
ExecStart=/usr/bin/suricata -c /etc/suricata/suricata.yaml -q 0 --pidfile /run/suricata.pid --user suricata --group suricata
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
# The NFQUEUE rules use --queue-bypass, so while Suricata is down traffic passes uninspected:
# come back quickly whatever the reason it stopped (a plain "systemctl stop" still stops it)
Restart=always
RestartSec=5

# Sandboxing. Suricata parses hostile traffic, so limit what a compromised process could reach.
# Not used: MemoryDenyWriteExecute (breaks the PCRE2 JIT the rules rely on).
ProtectSystem=strict
ReadWritePaths=/var/log/suricata /var/lib/suricata /run
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6 AF_PACKET
