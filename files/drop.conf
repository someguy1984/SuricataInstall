# Rules matching any line here are converted from alert to drop by suricata-update.
# Verified against this machine's alert history: none of its normal traffic matched.

# High-confidence malicious classtypes. The ET categories that describe policy or
# informational activity rather than attacks stay alert-only even with one of these
# classtypes (the same exclusion as the confidence rule below); rules from other sources
# (abuse.ch) have no "ET " prefix and are not affected by it.
re:^(?!.*msg:"ET (INFO|HUNTING|POLICY|GAMES|CHAT|P2P|DNS|DYN_DNS|TOR|USER_AGENTS) ).*classtype:trojan-activity
re:^(?!.*msg:"ET (INFO|HUNTING|POLICY|GAMES|CHAT|P2P|DNS|DYN_DNS|TOR|USER_AGENTS) ).*classtype:command-and-control
re:^(?!.*msg:"ET (INFO|HUNTING|POLICY|GAMES|CHAT|P2P|DNS|DYN_DNS|TOR|USER_AGENTS) ).*classtype:exploit-kit
re:^(?!.*msg:"ET (INFO|HUNTING|POLICY|GAMES|CHAT|P2P|DNS|DYN_DNS|TOR|USER_AGENTS) ).*classtype:domain-c2
re:^(?!.*msg:"ET (INFO|HUNTING|POLICY|GAMES|CHAT|P2P|DNS|DYN_DNS|TOR|USER_AGENTS) ).*classtype:credential-theft

# Whole ET Open groups: malware, mobile malware, coin miners, known-bad IP lists
group:emerging-malware.rules
group:emerging-mobile_malware.rules
group:emerging-coinminer.rules
group:ciarmy.rules
group:compromised.rules
group:drop.rules

# ET's own rating: confidence High + severity Major/Critical, excluding the
# categories that describe policy/informational activity rather than attacks
re:^(?!.*msg:"ET (INFO|HUNTING|POLICY|GAMES|CHAT|P2P|DNS|DYN_DNS|TOR|USER_AGENTS) ).*confidence High, signature_severity (Major|Critical)

# abuse.ch SSL Blacklist (these rules carry no classtype); Feodo Tracker and
# URLhaus rules are classtype trojan-activity, so they're covered above
re:SSLBL: Malicious SSL certificate
