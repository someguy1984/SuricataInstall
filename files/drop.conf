# Rules matching any line here are converted from alert to drop by suricata-update.
# Verified against this machine's alert history: none of its normal traffic matched.

# High-confidence malicious classtypes
re:classtype:trojan-activity
re:classtype:command-and-control
re:classtype:exploit-kit
re:classtype:domain-c2
re:classtype:credential-theft

# Whole ET Open groups: malware, mobile malware, coin miners, known-bad IP lists
group:emerging-malware.rules
group:emerging-mobile_malware.rules
group:emerging-coinminer.rules
group:ciarmy.rules
group:compromised.rules
group:drop.rules

# ET's own rating: confidence High + severity Major/Critical, excluding the
# categories that describe policy/informational activity rather than attacks
re:^(?!.*msg:"ET (INFO|HUNTING|POLICY|GAMES|CHAT|P2P|DNS|DYN_DNS|TOR|USER_AGENTS) ).*confidence High, signature_severity (Major|Critical)

# abuse.ch SSL Blacklist (these rules carry no classtype); Feodo Tracker and
# URLhaus rules are classtype trojan-activity, so they're covered above
re:SSLBL: Malicious SSL certificate
