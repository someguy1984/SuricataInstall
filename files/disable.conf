# Rules matching any line here are left out of the ruleset by suricata-update.
# install.sh installs this as /etc/suricata/disable.conf; keep edits here so they survive
# a re-install. Apply with: sudo ./install.sh   (or suricata-update && systemctl reload suricata)
#
# Something legitimate blocked? Add its SID on a line of its own, e.g.
#2027865

# Categories that can't apply to this machine. Fewer rules means less memory and a faster
# start and reload.
group:emerging-activex.rules      # Internet Explorer ActiveX controls
group:emerging-retired.rules      # rules ET has retired
group:emerging-scada.rules        # industrial control systems

# Optional, larger cuts. These are alert-only categories, so removing them changes what is
# reported, not what is blocked. Uncomment if they are only noise here.
#group:emerging-web_specific_apps.rules   # ~6,100 rules: attacks on web applications hosted here
#group:emerging-web_server.rules          # ~700 rules: attacks on web servers hosted here
#group:emerging-dyn_dns.rules             # ~6,100 rules: lookups of dynamic-DNS hostnames
