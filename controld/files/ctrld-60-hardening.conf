# Installed by controld_setup: sandbox ctrld (a third-party static binary running as root).
# /etc stays writable because ctrld rewrites /etc/resolv.conf; /usr and /boot are read-only.
# install.sh checks DNS still resolves after applying this and removes it if not.
[Service]
NoNewPrivileges=yes
ProtectSystem=true
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN CAP_NET_RAW CAP_DAC_OVERRIDE CAP_CHOWN CAP_FOWNER
# Not used: MemoryDenyWriteExecute. The ctrld release binary is packed (statically linked,
# no section headers) and unpacks itself into executable memory when it starts; with this
# option it dies with SIGSEGV before it serves a single query. Tested on ctrld as installed
# here, each option on its own: the ones below are fine, this one is not.
# Only the syscalls an ordinary service uses; anything else fails with EPERM rather than
# killing ctrld, so an unexpected call degrades instead of taking DNS down
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
KeyringMode=private
PrivateIPC=yes
# Not used: UMask=0077 (ctrld rewrites /etc/resolv.conf, which must stay world-readable)
