# Public DNS resolvers that apps use to bypass ctrld with their own DNS-over-HTTPS.
# One per line: a hostname or an IP address. This one list feeds both layers:
#
#   hostnames -> Suricata rules (dns-lockdown-rules.sh) that drop TLS (DoH) and QUIC (DoH3)
#                connections whose SNI is the name or any subdomain of it
#   IPs       -> firewall rules (dns-lockdown.sh, DNSLOCK chain) that refuse 443 to them,
#                which also covers connections that hide their SNI (ECH)
#
# ctrld's own upstream (dns.controld.com) must not be listed.
# Apply changes with: sudo ./install.sh   (in controld/)

# --- Hostnames. Append new ones at the end: the Suricata rule IDs follow the order here.
dns.google
cloudflare-dns.com
one.one.one.one
quad9.net
doh.opendns.com
dns.adguard-dns.com
dns.adguard.com
doh.cleanbrowsing.org
dns.nextdns.io
dns.mullvad.net
doh.mullvad.net
doh.dns.sb
freedns.controld.com
dns.alidns.com
doh.pub

