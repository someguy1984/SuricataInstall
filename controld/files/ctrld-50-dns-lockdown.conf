# Installed by controld_setup: a restarted ctrld gets a fresh cgroup, so rebuild
# the DNSLOCK exemption for it. '-' means a failure here never stops ctrld;
# '+' runs it outside ctrld's sandbox (60-hardening.conf) so iptables works.
[Service]
ExecStartPost=-+/usr/local/sbin/dns-lockdown.sh refresh
