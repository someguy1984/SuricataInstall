# Installed as /etc/modprobe.d/edr-sctp-block.conf (client PLAN section 4.2 and Appendix A.4).
# NGINX2Root's root step opens an SCTP socket from a compromised worker, and the kernel loads the
# sctp module on demand. This line stops the module loading. It does not unload a module that is
# already loaded and does nothing if SCTP is built into the kernel (check.sh reports which);
# install the kernel update for CVE-2026-64564 and reboot. If lsinitramfs shows sctp in the
# initrd, run update-initramfs -u (it is not there on the 26.04 reference host).
install sctp /bin/false
