# Installed as /etc/systemd/resolved.conf.d/zz-edr-doh.conf (client PLAN section 4.4).
# Sends the box's own lookups to the local DoH proxy. Drop-ins sort by file name across
# directories and digits sort before letters, so "10-" or "50-" would sort before DigitalOcean's
# DigitalOcean.conf and keep its servers; "zz-" sorts after it. The empty assignments reset
# the list the earlier files built. The per-link resolvers from netplan and cloud-init stay: they
# are the fail-open path. Apply with `systemctl restart systemd-resolved` (a SIGHUP reload needs
# systemd 256, and 24.04 has 255).
[Resolve]
DNS=
Domains=
DNS=127.0.2.1
Domains=~.
