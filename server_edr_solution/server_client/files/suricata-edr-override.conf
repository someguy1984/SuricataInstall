# Installed as /etc/systemd/system/suricata.service.d/override.conf (client PLAN section 4.1).
# A drop-in on the packaged suricata.service, which already runs af-packet and --user suricata. It
# has no ExecStart= line on purpose: the packaged
#   /usr/bin/suricata --af-packet -c /etc/suricata/suricata.yaml --pidfile /run/suricata.pid --user suricata --group suricata
# stays (an ExecStart= reset would lose --af-packet), and --user suricata must stay (the log group
# and the agent's reads depend on it). Built from the laptop's suricata-override.conf: the NFQUEUE
# parts (-q 0, the nfqueue unit, Restart=always at 1 s) are gone.
#
# IDS only, on a copy of the traffic: if Suricata dies the site is unaffected. The kernel kills
# it first under memory pressure (OOMScoreAdjust=800; Tetragon gets 700), and a failing start is
# not a CPU loop (RestartSec=30, 5 starts in 10 minutes at most). The limits are starting values
# for a 2 GB droplet: set them after the VM test measures the reload peak.
[Unit]
StartLimitIntervalSec=10min
StartLimitBurst=5

[Service]
# Bring HOME_NET up to date before each start ("+": outside the sandbox below so it can write
# /etc/suricata; "-": a failure here must not stop Suricata starting)
ExecStartPre=-+/usr/bin/python3 -I /usr/local/lib/edr-agent/edr-home-net --no-reload
AmbientCapabilities=CAP_NET_RAW
# Suricata starts as root and needs setuid and setgid to drop to the suricata user, and af-packet
# may need CAP_NET_ADMIN for promiscuous mode; the VM test removes what it can and records the minimum
CapabilityBoundingSet=CAP_NET_RAW CAP_NET_ADMIN CAP_SETUID CAP_SETGID
OOMScoreAdjust=800
MemoryHigh=1000M
MemoryMax=1300M
Restart=on-failure
RestartSec=30
Nice=10
CPUWeight=50
IOWeight=20

# Sandboxing. Suricata parses hostile traffic, so limit what a compromised process could reach.
# Not used: MemoryDenyWriteExecute (breaks the PCRE2 JIT the rules rely on).
ProtectSystem=strict
ReadWritePaths=/var/log/suricata /var/lib/suricata /run
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6 AF_PACKET
