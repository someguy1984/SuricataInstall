# Installed as /etc/systemd/system/dnscrypt-proxy.service.d/50-edr.conf (client PLAN section 4.4).
# Sandbox and start line for the packaged dnscrypt-proxy. The proxy has no sd_notify, so there is
# no WatchdogSec: edr-dns-watch probes it instead. Run `edr-dns-watch render` after a change of
# stamps: it writes the IPAddressAllow= lines for each stamp address at the marker below.
[Unit]
StartLimitIntervalSec=0

[Service]
# The packaged ExecStart is replaced; the config is the kit's, outside the packaged conffile
ExecStart=
ExecStart=/usr/sbin/dnscrypt-proxy -config /etc/edr-dns/dnscrypt-proxy.toml
# The lock's exemption is by this user name (not by cgroup), so the unit keeps a fixed User=
User=_dnscrypt-proxy
DynamicUser=no
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
MemoryMax=96M
IPAddressDeny=any
IPAddressAllow=localhost
# @IPADDRESSALLOW@
Restart=always
RestartSec=2
