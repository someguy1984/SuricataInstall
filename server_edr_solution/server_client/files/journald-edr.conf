# Installed as /etc/systemd/journald@edr.conf: the journal namespace of the kit's own units
# (client PLAN section 9). Read it with `journalctl --namespace=edr`. Uninstall removes it.
# The kernel and audit lines (edr-bigconn:, edr-dnslock:, edr-egress:) stay in the default journal.
[Journal]
SystemMaxUse=150M
RuntimeMaxUse=50M
