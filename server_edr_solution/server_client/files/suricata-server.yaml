%YAML 1.1
---
# Suricata 8.x configuration for a web server (client PLAN section 4.1): af-packet IDS on a copy of
# the traffic, never inline. Generated from the laptop kit's suricata/files/suricata.yaml with the
# changes of the plan's server table applied; the sections a server does not use (nfq, dpdk,
# netmap, pfring, ...) are left out and Suricata uses its built-in defaults for them.
# Installed as the candidate /etc/suricata/suricata.yaml: the installer replaces @PUBLIC_IFACE@
# (and the "threads: 1" line: 2 on a host with 4 or more vCPUs), tests it with `suricata -T` under
# systemd-run -p MemoryMax=900M, and only then commits it. The comments of the laptop file are not
# carried over; read them there.
#
# Server values: workers, threads 1; detect.profile medium; mpm-algo auto (never "hs"); memcaps
# stream 32M, reassembly 128M, flow 64M; NIC offloads left alone (capture.disable-offloading:
# false); checksum checks off; stream.midstream false; reassembly depth 512kb; TLS and SSH bypass
# after the handshake (SNI, JA4 and HASSH are logged first); sgh-mpm-caching with a 7 day max age.
# HOME_NET: the include: at the end brings in /etc/suricata/edr-home-net.yaml (written by
# edr-home-net), which holds the single dotted key vars.address-groups.HOME_NET and so replaces
# only the placeholder below. An include that names the vars: mapping again would empty it
# (tested on 8.0.8: 2 of 29 variables left). Verify with `suricata --dump-config | grep '^vars'`.
# Two eve instances: eve.json (alert, anomaly, stats) and eve-bulk.json (tls, ssh, quic), which
# edr-diskguard may drop. http, dns, flow, files and drop are not logged.
# /etc/suricata/edr-dns.rules holds the low-priority DoH SNI alerts (a stub until the DNS step).
suricata-version: '8.0'
vars:
  address-groups:
    HOME_NET: '[127.0.0.0/8,::1/128]'
    EXTERNAL_NET: '!$HOME_NET'
    HTTP_SERVERS: $HOME_NET
    SMTP_SERVERS: $HOME_NET
    SQL_SERVERS: $HOME_NET
    DNS_SERVERS: $HOME_NET
    TELNET_SERVERS: $HOME_NET
    AIM_SERVERS: $EXTERNAL_NET
    DC_SERVERS: $HOME_NET
    DNP3_SERVER: $HOME_NET
    DNP3_CLIENT: $HOME_NET
    MODBUS_CLIENT: $HOME_NET
    MODBUS_SERVER: $HOME_NET
    ENIP_CLIENT: $HOME_NET
    ENIP_SERVER: $HOME_NET
  port-groups:
    HTTP_PORTS: '80'
    SHELLCODE_PORTS: '!80'
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: '[$HTTP_PORTS,110,143]'
    FTP_PORTS: 21
    GENEVE_PORTS: 6081
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544
    SIP_PORTS: '[5060, 5061]'
default-log-dir: /var/log/suricata/
stats:
  enabled: true
  interval: 60
plugins: null
outputs:
- eve-log:
    enabled: true
    filetype: regular
    filename: eve.json
    community-id: true
    community-id-seed: 0
    types:
    - alert:
        payload: true
        payload-buffer-size: 4 KiB
        payload-printable: false
        packet: false
        payload-length: true
        metadata: true
        tagged-packets: false
    - anomaly:
        enabled: true
        types:
          decode: false
          stream: false
          applayer: true
    - stats:
        totals: true
        threads: false
        deltas: false
- eve-log:
    enabled: true
    filetype: regular
    filename: eve-bulk.json
    community-id: true
    community-id-seed: 0
    types:
    - tls:
        extended: true
    - ssh: null
    - quic: null
logging:
  default-log-level: notice
  default-output-filter: null
  outputs:
  - console:
      enabled: true
  - file:
      enabled: true
      level: info
      filename: suricata.log
  - syslog:
      enabled: false
af-packet:
- interface: @PUBLIC_IFACE@
  threads: 1
  cluster-id: 99
  cluster-type: cluster_flow
  defrag: true
  use-mmap: true
  tpacket-v3: true
  ring-size: 2048
  block-size: 32768
  mmap-locked: false
  checksum-checks: false
app-layer:
  protocols:
    telnet:
      enabled: true
    rfb:
      enabled: true
      detection-ports:
        dp: 5900, 5901, 5902, 5903, 5904, 5905, 5906, 5907, 5908, 5909
    mqtt:
      enabled: true
    krb5:
      enabled: true
    bittorrent-dht:
      enabled: true
    snmp:
      enabled: true
    ike:
      enabled: true
    tls:
      enabled: true
      detection-ports:
        dp: 443
      encryption-handling: bypass
      ja4-fingerprints: true
    pgsql:
      enabled: true
      stream-depth: 0
    dcerpc:
      enabled: true
    ftp:
      enabled: true
    websocket: null
    rdp: null
    ssh:
      enabled: true
      encryption-handling: bypass
      hassh: true
    doh2:
      enabled: true
    http2:
      enabled: true
    smtp:
      enabled: true
      raw-extraction: false
      mime:
        decode-mime: true
        decode-base64: true
        decode-quoted-printable: true
        header-value-depth: 2000
        extract-urls: true
        body-md5: false
      inspected-tracker:
        content-limit: 100000
        content-inspect-min-size: 32768
        content-inspect-window: 4096
    imap:
      enabled: detection-only
    pop3:
      enabled: true
      detection-ports:
        dp: 110
      stream-depth: 0
    smb:
      enabled: true
      detection-ports:
        dp: 139, 445
    nfs:
      enabled: true
    tftp:
      enabled: true
    dns:
      tcp:
        enabled: true
        detection-ports:
          dp: 53
      udp:
        enabled: true
        detection-ports:
          dp: 53
    http:
      enabled: true
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 100 KiB
          response-body-limit: 100 KiB
          request-body-minimal-inspect-size: 32 KiB
          request-body-inspect-window: 4 KiB
          response-body-minimal-inspect-size: 40 KiB
          response-body-inspect-window: 16 KiB
          response-body-decompress-layer-limit: 2
          http-body-inline: auto
          swf-decompression:
            enabled: false
            type: both
            compress-depth: 100 KiB
            decompress-depth: 100 KiB
          double-decode-path: false
          double-decode-query: false
        server-config: null
    modbus:
      enabled: true
      detection-ports:
        dp: 502
      stream-depth: 0
    dnp3:
      enabled: true
      detection-ports:
        dp: 20000
    enip:
      enabled: true
      detection-ports:
        dp: 44818
        sp: 44818
    ntp:
      enabled: true
    quic:
      enabled: true
    dhcp:
      enabled: true
    sip: null
    ldap:
      tcp:
        enabled: true
        detection-ports:
          dp: 389, 3268
      udp:
        enabled: true
        detection-ports:
          dp: 389, 3268
    mdns:
      enabled: true
asn1-max-frames: 256
security:
  limit-noproc: true
  landlock:
    enabled: true
    directories:
      write:
      - /var/log/suricata/
      - /var/lib/suricata/
      - /run/
      read:
      - /usr/
      - /etc/
      - /etc/suricata/
      - /proc/
  lua: null
coredump:
  max-dump: 0
host-mode: auto
legacy:
  uricontent: enabled
exception-policy: auto
engine-analysis:
  rules-fast-pattern: true
  rules: true
pcre:
  match-limit: 3500
  match-limit-recursion: 1500
host-os-policy:
  windows:
  - 0.0.0.0/0
  bsd: []
  bsd-right: []
  old-linux: []
  linux: []
  old-solaris: []
  solaris: []
  hpux10: []
  hpux11: []
  irix: []
  macos: []
  vista: []
  windows2k3: []
defrag:
  memcap: 32 MiB
  hash-size: 65536
  trackers: 65535
  max-frags: 65535
  prealloc: true
  timeout: 60
flow:
  memcap: 64 MiB
  hash-size: 65536
  prealloc: 10000
  emergency-recovery: 30
vlan:
  use-for-tracking: true
livedev:
  use-for-tracking: true
flow-timeouts:
  default:
    new: 30
    established: 300
    closed: 0
    bypassed: 100
    emergency-new: 10
    emergency-established: 100
    emergency-closed: 0
    emergency-bypassed: 50
  tcp:
    new: 60
    established: 600
    closed: 60
    bypassed: 100
    emergency-new: 5
    emergency-established: 100
    emergency-closed: 10
    emergency-bypassed: 50
  udp:
    new: 30
    established: 300
    bypassed: 100
    emergency-new: 10
    emergency-established: 100
    emergency-bypassed: 50
  icmp:
    new: 30
    established: 300
    bypassed: 100
    emergency-new: 10
    emergency-established: 100
    emergency-bypassed: 50
stream:
  memcap: 32 MiB
  checksum-validation: false
  midstream: false
  inline: false
  reassembly:
    urgent:
      policy: oob
      oob-limit-policy: drop
    memcap: 128 MiB
    depth: 512 KiB
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560
    randomize-chunk-size: true
host:
  hash-size: 4096
  prealloc: 1000
  memcap: 32 MiB
decoder:
  teredo:
    enabled: true
    ports: $TEREDO_PORTS
  vxlan:
    enabled: true
    ports: $VXLAN_PORTS
  geneve:
    enabled: true
    ports: $GENEVE_PORTS
  recursion-level:
    use-for-tracking: true
detect:
  profile: medium
  custom-values:
    toclient-groups: 3
    toserver-groups: 25
  sgh-mpm-context: auto
  sgh-mpm-caching: true
  sgh-mpm-caching-path: /var/lib/suricata/cache/sgh
  prefilter:
    default: mpm
  grouping: null
  thresholds:
    hash-size: 16384
    memcap: 16 MiB
    cache: null
  profiling:
    grouping:
      dump-to-disk: false
      include-rules: false
      include-mpm-stats: false
  sgh-mpm-caching-max-age: 7d
mpm-algo: auto
spm-algo: auto
threading:
  set-cpu-affinity: false
  autopin: false
  cpu-affinity:
    management-cpu-set:
      cpu:
      - 0
    receive-cpu-set:
      cpu:
      - 0
    worker-cpu-set:
      cpu:
      - all
      mode: exclusive
      prio:
        low:
        - 0
        medium:
        - 1-2
        high:
        - 3
        default: medium
      interface-specific-cpu-set:
      - interface: enp4s0f0
        cpu:
        - 1
        - 3
        - 5
        - 7
        - 9
        mode: exclusive
        prio:
          high:
          - all
          default: medium
  detect-thread-ratio: 1.0
capture:
  disable-offloading: false
default-rule-path: /var/lib/suricata/rules
rule-files:
- suricata.rules
- /etc/suricata/local.rules
- /etc/suricata/edr-dns.rules
classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config
threshold-file: /etc/suricata/threshold.config
firewall: null
runmode: workers
include:
- /etc/suricata/edr-home-net.yaml
