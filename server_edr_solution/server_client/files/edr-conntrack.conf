# Installed as /etc/sysctl.d/90-edr-conntrack.conf, only if the kit loaded nf_conntrack or the
# limit was still the default (client PLAN section 4.2). A 2 GB droplet gets 65,536 entries by
# default, which about 550 new connections a second fill with TIME_WAIT alone; a full table
# drops new connections. 262144 entries cost about 67 MB worst case. Established timeouts are
# not shortened. Accounting is switched on because the large-connection watch counts
# "ct original bytes" (loading that rule switches it on too). Uninstall removes this file when the
# kit made it. install.sh --no-kernel skips it, and applies it with sysctl -p only after
# `modprobe nf_conntrack` (sysctl.d can run before the module is loaded).
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_acct = 1
