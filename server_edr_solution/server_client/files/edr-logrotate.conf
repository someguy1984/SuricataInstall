# The kit's own logrotate configuration (client PLAN section 9), run every 2 minutes by
# edr-diskguard with its own state file under /var/lib/edr-diskguard, so the stock daily
# logrotate run cannot clash with it. Installed as /etc/edr-agent/logrotate.conf.
#
# The packaged /var/log/suricata is not root-owned, so every stanza uses "su suricata suricata"
# and "create 640 suricata suricata". "delaycompress" stays: the file just rotated is plain, so the
# agent can finish reading it by its checkpoint (client PLAN section 4.5, Tail and checkpoints).
# Rotation is followed by a HUP, which makes Suricata reopen its logs without dropping a packet.
#
# edr-diskguard appends a stanza for the opt-in nginx info log (/var/log/nginx/edr.log, size 20M,
# rotate 2) when [agent] nginx_info_log = on.
#
# Worst case on disk (PLAN section 9): eve.json about 250 MB, eve-bulk.json about 100 MB,
# suricata.log about 20 MB.

/var/log/suricata/eve.json {
    size 50M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    su suricata suricata
    create 640 suricata suricata
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s HUP suricata.service 2>/dev/null || /bin/kill -HUP "$(cat /run/suricata.pid 2>/dev/null)" 2>/dev/null || true
    endscript
}

/var/log/suricata/eve-bulk.json {
    size 25M
    rotate 2
    compress
    delaycompress
    missingok
    notifempty
    su suricata suricata
    create 640 suricata suricata
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s HUP suricata.service 2>/dev/null || /bin/kill -HUP "$(cat /run/suricata.pid 2>/dev/null)" 2>/dev/null || true
    endscript
}

/var/log/suricata/suricata.log {
    size 10M
    rotate 1
    compress
    delaycompress
    missingok
    notifempty
    su suricata suricata
    create 640 suricata suricata
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s HUP suricata.service 2>/dev/null || /bin/kill -HUP "$(cat /run/suricata.pid 2>/dev/null)" 2>/dev/null || true
    endscript
}
