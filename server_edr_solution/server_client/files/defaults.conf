# Defaults of /etc/edr-agent/local.conf (client PLAN section 14). Installed as
# /usr/local/lib/edr-agent/defaults.conf and replaced on every upgrade: change nothing here. Put a
# choice in /etc/edr-agent/local.conf, which overrides this file key by key, then run
# `edr-agent apply-config` (add --check to see the diff and the effective values first).
#
# INI. "#" starts a comment only at the start of a line. Lists are comma separated, durations are
# like 30s 10m 1h 7d, sizes like 64M 4G. Guards that protect the host from a hostile hub or agent
# are constants in code, not keys. No secrets live here: the webhook URL is in
# /etc/edr-agent/notify.url (root 0600).

[sites]
# discovered by `edr-agent discover` at install and after apply-config; --webroot overrides web_roots
web_users =
web_roots =
nginx_bin =
phpfpm_bins =
php_cli_bins =
# the VPC range: edr-home-net, the never-ban list and the DNS rules all read this one key
vpc_cidr =
# own addresses that are on no interface (a Reserved IP, a public IPv6): added to HOME_NET and never-ban
extra_addresses =

[bans]
# never-ban additions: the install-time SSH source (and --admin-ip), and the operator allowlist
admin_ip =
allow_cidr =
# on, observe (alert but write no ban) or off
auto_ban = on
hub_bans = on
feeds = on
# auto, on or off: web-sourced bans behind a proxy or CDN
proxy_mode = auto
# the large-connection watch: log only unless bigconn_cap is set (--bigconn-cap SIZE)
bigconn_bytes = 4G
bigconn_cap = off

[thresholds]
ssh_fail = 5/10m
tripwire = 5/5m
suricata = 3/10m
window_update = 3/10m
bigconn_repeat = 2/1h
# distinct Suricata signatures that also trigger a ban
suricata_sigs = 2/10m
ban_budget_per_hour = 30
ban_max_active = 1000
ban_ladder = 1h,6h,24h,7d
ban_memory = 14d

[tetragon]
# policies allowed to enforce once their gate has passed; empty is observe-only
enforce = nginx-exec,sctp-socket
# extra ports for web-connect (--allow-egress-port); the built-in list always applies
egress_ports =
# the web-exec allowlist, written by `edr-agent learn --accept`; web-exec enforcement refuses
# until a local.conf holds this key
web_exec_allow =

[suricata]
lite = off
sslbl = off
# auto, or a list of CIDRs that replaces HOME_NET (the VPC range stays [sites] vpc_cidr)
home_net = auto

[kernel]
# the modprobe.d block on the sctp module
sctp_block = on

[kit]
# off skips that component's policies, checks and pre-flight
web = on
tetragon = on
suricata = on
kernel = on

[diskguard]
# stage 3 of the disk guard stops Suricata below 3% free; off makes it alert only
stop_suricata = on

[dns]
lockdown = on
lock_forwarded = off
block_doh_ips = off
# off, or auto: a rule for the VPC resolver (private names of managed databases)
vpc_dns = off
# extra names for the pre-flight and the watchdog's probes
resolve_check =

[agent]
redact = on
# hex-head keeps 128 bytes of an alert payload as hex; off drops it
payload = hex-head
# redact or drop
args = redact
# per source, six sources: HIGH and CRITICAL bypass it
event_budget_per_hour = 2000
access_ring_minutes = 5
access_ring_lines = 20000
# opt-in extra log input (needs an error_log ... info line in nginx, which the kit never writes)
nginx_info_log = off
laravel_log =
login_route =
# discovered from `sshd -T`
sshd_password_auth =
dns_telemetry = on
rehome_confirm_timeout = 300s

[notify]
# edr-notify threshold; it stays off until /etc/edr-agent/notify.url exists
min_severity = HIGH

[response]
auto_restart_nginx = false

[isolate]
# extra egress allowed by `edr-agent isolate --all`: database and Redis hosts
allow =
