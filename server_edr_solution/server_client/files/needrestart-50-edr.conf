# Installed as /etc/needrestart/conf.d/50-edr.conf (client PLAN section 7, step 9). needrestart
# must not restart the kit's own units behind the operator's back: a restart of tetragon drops its
# policies for a moment and emits a blind window, a restart of dnscrypt-proxy stalls DNS. Keys are
# added to the hash; the hash is never reassigned, so the operator's own overrides survive.
$nrconf{override_rc}{qr(^tetragon)} = 0;
$nrconf{override_rc}{qr(^edr-)} = 0;
$nrconf{override_rc}{qr(^dnscrypt-proxy)} = 0;
