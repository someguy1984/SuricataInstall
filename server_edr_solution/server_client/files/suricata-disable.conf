# Server variant of suricata/files/disable.conf (client PLAN section 4.1.1). Installed as
# /etc/suricata/disable.conf. Rules matching any line here are left out of the ruleset by
# suricata-update. `suricata-update` re-enables rules whose flowbits others need, so check the final
# rule count (about 30k for ET Open alone, about 41k with the sslbl source).
#
# Something legitimate flagged? Add its SID on a line of its own, e.g.
#2027865

