# Installed as /etc/systemd/system/tetragon.service.d/50-edr-check.conf (client PLAN section 4.3):
# check the policy set right after Tetragon starts. --no-block: never delays Tetragon, and the "-"
# means a failure here is ignored.
[Service]
ExecStartPost=-/usr/bin/systemctl start --no-block edr-policy-check.service
