# Mock environment for server_edr_solution: a hub and a web droplet on a private network.
#
#   ./mock.sh up       build and start, then wait until both are healthy
#   ./mock.sh test     smoke test (page on :80 and :443, the release's PHP, hub reachable over the private network)
#   ./mock.sh down     stop and remove (add --volumes to forget certificates)
#   dist, install-hub, install-web, enroll, e2e, uninstall: the real installers (see README.md)
#
# Networks
#   edr_vpc     10.77.0.0/24, internal: the "DigitalOcean VPC". No route out; only hub <-> web.
#               hub = 10.77.0.10 (hub, hub.dev.local), web = 10.77.0.20 (web, web.dev.local)
#   edr_egress  ordinary bridge for package downloads and rule/feed updates, as a droplet has.
#
# Only the web box publishes ports, and only on the host's loopback: http://web.dev.local and
# https://web.dev.local after adding "127.0.0.1 web.dev.local" to /etc/hosts.
#
# systemd runs as PID 1, which needs extra privileges. Under rootless Docker those privileges stay
# inside your user namespace; under rootful Docker they are real root on the host (see README).

# MOCK_UBUNTU (26.04 or 24.04) and MOCK_PHP choose the release; mock.sh sets both. One release runs at a time:
# the project name is the same, so `up` with the other release replaces the boxes.

name: edr-mock

x-droplet: &droplet
  privileged: true
  cgroup: private
  tmpfs:
    - /run
    - /run/lock
    - /tmp
  stop_signal: SIGRTMIN+3
  stop_grace_period: 20s
  restart: unless-stopped

# Each service mounts the whole repo read-only at /opt/SuricataInstall, because the installers reuse
# the laptop kit (tetragon/, controld/, suricata/), plus a volume for its mock certificate.

services:
  hub:
    <<: *droplet
    build:
      context: .
      target: hub
      args:
        UBUNTU_TAG: ${MOCK_UBUNTU:-26.04}
    image: edr-mock-hub:${MOCK_UBUNTU:-26.04}
    hostname: hub
    networks:
      edr_vpc:
        ipv4_address: 10.77.0.10
        aliases: [hub.dev.local]
      edr_egress: {}
    volumes:
      - ../..:/opt/SuricataInstall:ro
      - hub_tls:/etc/ssl/mock
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet mock-hub-placeholder || systemctl is-active --quiet edr-hub"]
      interval: 5s
      timeout: 5s
      retries: 24

  web:
    <<: *droplet
    build:
      context: .
      target: web
      args:
        UBUNTU_TAG: ${MOCK_UBUNTU:-26.04}
        PHP_VERSION: ${MOCK_PHP:-8.5}
    image: edr-mock-web:${MOCK_UBUNTU:-26.04}
    hostname: web
    networks:
      edr_vpc:
        ipv4_address: 10.77.0.20
        aliases: [web.dev.local]
      edr_egress: {}
    ports:
      # MOCK_HTTP_PORT and MOCK_HTTPS_PORT move the published ports when 80 or 443 is taken on this machine
      - "127.0.0.1:${MOCK_HTTP_PORT:-80}:80"
      - "127.0.0.1:${MOCK_HTTPS_PORT:-443}:443"
    volumes:
      - ../..:/opt/SuricataInstall:ro
      - web_tls:/etc/ssl/mock
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet nginx php${MOCK_PHP:-8.5}-fpm && curl -fsS -o /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      hub:
        condition: service_healthy

networks:
  edr_vpc:
    internal: true
    ipam:
      config:
        - subnet: 10.77.0.0/24
  edr_egress: {}

volumes:
  hub_tls: {}
  web_tls: {}
