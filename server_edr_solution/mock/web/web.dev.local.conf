# web.dev.local: a hello-world PHP 8.5 site laid out like a Laravel app (document root = public/).
#
# Port 80 serves the page too, rather than redirecting, so Suricata has plain HTTP to inspect in the
# mock (it can't read HTTPS). A real site would `return 301 https://$host$request_uri;` here.

server {
    listen 80;
    listen [::]:80;
    server_name web.dev.local localhost;
    include /etc/nginx/sites-available/web.dev.local.common;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 on, as on most production droplets. This is the feature NGINX2Root's main bug
    # (CVE-2026-123007) needs; this image's nginx (1.28.3-2ubuntu1.13) is the USN-9159-1 fixed build.
    http2 on;
    server_name web.dev.local localhost;

    ssl_certificate     /etc/ssl/mock/web.dev.local.crt;
    ssl_certificate_key /etc/ssl/mock/web.dev.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:mockssl:1m;

    add_header Strict-Transport-Security "max-age=300" always;
    include /etc/nginx/sites-available/web.dev.local.common;
}
