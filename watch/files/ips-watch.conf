# Settings for ips-watch (the scheduled health and activity check).
# Installed as /etc/ips-watch.conf; this is a shell file, so no spaces around "=".

# Suricata findings: the lowest analyse.py risk level that also shows a desktop
# notification. MEDIUM, HIGH or CRITICAL. Findings from MEDIUM up always go to the
# journal (journalctl -t ips-alert) whatever this is set to.
NOTIFY_MIN=HIGH

# Minutes of Suricata's logs to analyse on each run. Keep it equal to the timer's
# interval (ips-watch.timer, 15 minutes) so nothing is skipped or counted twice.
WINDOW_MIN=15

# A finding with the same title is not reported again for this many minutes.
REPEAT_MIN=60

# While a health problem lasts, remind about it this often (hours).
REMIND_HOURS=6
