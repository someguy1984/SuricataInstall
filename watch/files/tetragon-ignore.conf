# Tetragon policy hits that should NOT pop up as a desktop notification.
# Installed as /etc/ips-watch/tetragon-ignore.conf (root-only). Nothing here removes an
# event from the journal or from Tetragon's log; it only decides what interrupts you.
#
# One Python regular expression per line, searched in each event's summary line:
#
#     POLICY FUNCTION BINARY DETAIL
#
# See the lines for your own machine, with "-" in front of the ones this file drops:
#   journalctl -t tetragon-alerts --since -1d -o cat \
#     | /usr/local/lib/ips-watch/tetragon-notify.py --print | sort | uniq -c | sort -rn
# After editing: sudo systemctl restart tetragon-notify
#
# Keep patterns as narrow as the noise they silence: anchor the policy (^policy ) and name
# the binary in full, so a different program doing the same thing still notifies. A binary
# is named by its real path, which is not always the one you type (sudo may be
# /usr/lib/cargo/bin/sudo). The list below is what a stock Ubuntu desktop with rootless
# Docker does all day; trim or extend it for your machine.

# --- privilege-escalation: programs whose job is to become root -------------------------
^privilege-escalation \S+ /usr/bin/(sudo|su|pkexec|fusermount3|snap|apt|apt-get|unattended-upgrade|Xwayland)( |$)
^privilege-escalation \S+ /usr/lib/cargo/bin/(sudo|su)( |$)
^privilege-escalation \S+ /usr/sbin/cron( |$)
^privilege-escalation \S+ /usr/libexec/(gdm-session-worker|xdg-document-portal)( |$)
^privilege-escalation \S+ /snap/snapd/\S+/usr/lib/snapd/snapd( |$)
# rootless Docker's runtime, every time a container or health check starts
^privilege-escalation \S+ /usr/bin/runc( |$)
# systemd starting a service (it runs its executor through a file descriptor)
^privilege-escalation \S+ /proc/self/fd/\d+( |$)

# --- sensitive-files: the login and package machinery reading the password files --------
^sensitive-files \S+ /usr/(bin|lib/cargo/bin)/sudo /etc/(sudoers|shadow)
^sensitive-files \S+ /usr/libexec/(accounts-daemon|gdm-session-worker) /etc/shadow
^sensitive-files \S+ /usr/sbin/dpkg-preconfigure /etc/shadow
^sensitive-files \S+ /proc/self/fd/\d+ /etc/shadow
# GNOME's keyring front ends listing your SSH keys
^sensitive-files \S+ /usr/bin/seahorse \S+/\.ssh/id_
^sensitive-files \S+ /usr/libexec/gcr-ssh-agent \S+/\.ssh/id_

# --- kernel-tampering: eBPF programs loaded by the system itself ------------------------
^kernel-tampering bpf_check (/snap/snapd/\S+)?/usr/lib/snapd/snap-confine( |$)
^kernel-tampering bpf_check /usr/lib/systemd/systemd-networkd( |$)

# --- monitor-kernel-modules: the kernel asking for a module it needs, modprobe loading
# one from /lib/modules, and the matching unloads. A module loaded from anywhere else
# (insmod some/file.ko) still notifies.
^monitor-kernel-modules security_kernel_module_request
^monitor-kernel-modules (do_init_module|security_kernel_read_file|free_module) (/usr)?/sbin/modprobe( |$)
^monitor-kernel-modules (do_init_module|free_module) /usr/bin/udevadm( |$)

# --- persistence: the package managers writing units, cron jobs and apt hooks -----------
^persistence \S+ /usr/bin/(dpkg|apt|apt-get|unattended-upgrade)( |$)
^persistence \S+ /snap/snapd/\S+/usr/lib/snapd/snapd( |$)

# --- stack-tamper: this setup's own automation ------------------------------------------
# the daily rule update
^stack-tamper \S+ /usr/bin/python3\S* .*/var/lib/suricata/rules
# HOME_NET following a network change (suricata-home-net rewrites suricata.yaml)
^stack-tamper \S+ /usr/bin/(gawk|mawk|awk|mv|chown|chmod|mktemp) .*/etc/suricata

# --- setuid-files: package installs setting the bit on the programs that need it --------
^setuid-files \S+ /usr/bin/dpkg( |$)
